name: Deploy to Vercel

# CD: deploy production only after the CI workflow (check + e2e) passed on main. D38.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_URL: https://whyquiet.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
      # Schema first, so new code never runs against an old database. Migrations must stay compatible with the live code. D51.
      - name: Migrate database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx -y supabase@2 link --project-ref grflsfhkcatoxpjeszxh
          npx -y supabase@2 db push --yes
      - name: Deploy
        run: npx -y vercel@58 deploy --prod --yes --token="$VERCEL_TOKEN"
      # Check the production domain: per-deployment URLs sit behind Vercel's deployment protection.
      - name: Verify live site
        run: uv run --no-project --with httpx python scripts/verify_deploy.py "$PROD_URL"
